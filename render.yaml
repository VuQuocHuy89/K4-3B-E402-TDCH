services:
  - type: web
    name: pathwise-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_PROVIDER
        value: openrouter
      - key: DATABASE_URL
        fromDatabase:
          name: pathwise-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: LEARNING_PACKAGE_MAX_TOKENS
        value: "3200"
      - key: AI_TIMEOUT_MS
        value: "12000"
      - key: SOURCE_DISCOVERY_TIMEOUT_MS
        value: "8000"
      - key: DOCUMENT_PDF_URL
        sync: false
      - key: DOCUMENT_PDF_CACHE_PATH
        value: /tmp/pathwise-document.pdf
      - key: CONTENT_CATALOG_VERSION
        value: seed-v1

databases:
  - name: pathwise-db
    databaseName: pathwise
    user: pathwise
    plan: free
