services:
  - type: web
    name: pathwise-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_PROVIDER
        value: openrouter
      - key: DATABASE_URL
        fromDatabase:
          name: pathwise-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nex-agi/nex-n2.5-mini:free
      - key: OPENROUTER_REASONING_EFFORT
        value: none
      - key: LEARNING_PACKAGE_MAX_TOKENS
        value: "3200"
      - key: AI_TIMEOUT_MS
        value: "15000"
      - key: AI_HEDGE_DELAY_MS
        value: "12000"
      - key: AI_CACHE_VERSION
        value: v1
      - key: BLUEPRINT_TIMEOUT_MS
        value: "20000"
      - key: LEARNING_PACKAGE_TIMEOUT_MS
        value: "25000"
      - key: SOURCE_DISCOVERY_TIMEOUT_MS
        value: "12000"
      - key: DOCUMENT_PDF_URL
        sync: false
      - key: DOCUMENT_PDF_CACHE_PATH
        value: /tmp/pathwise-document.pdf
      - key: CONTENT_CATALOG_VERSION
        value: seed-v1

databases:
  - name: pathwise-db
    databaseName: pathwise
    user: pathwise
    plan: free
